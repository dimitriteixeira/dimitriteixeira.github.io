<style>
  :root {
    --bg: #FBFBFD; --ink: #1D1D1F; --muted: #86868B;
    --glow-a: rgba(255, 180, 130, .55); --glow-b: rgba(170, 150, 255, .45); --floor: rgba(0, 0, 0, .16);
    --grad: linear-gradient(95deg, #F56A2D 0%, #E8417A 48%, #8B5CF6 100%);
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --display: "Space Grotesk", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --ink: #F5F5F7; --muted: #86868B; --glow-a: rgba(255, 140, 90, .30); --glow-b: rgba(140, 110, 255, .32); --floor: rgba(255, 255, 255, .07); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    min-height: 100svh; display: grid; place-items: center; padding: 48px 24px; overflow-x: hidden; }
  main { display: flex; flex-direction: column; align-items: center; text-align: center; }

  .stage { position: relative; width: min(70vw, 400px); aspect-ratio: 1; }
  .glow { position: absolute; inset: -18%; z-index: 0; pointer-events: none; filter: blur(48px);
    background: radial-gradient(42% 42% at 38% 46%, var(--glow-a), transparent 70%), radial-gradient(44% 44% at 64% 54%, var(--glow-b), transparent 70%); }
  .portrait { position: absolute; inset: 0; z-index: 1; will-change: transform; transform-origin: 50% 85%;
    -webkit-mask-image: linear-gradient(#000 74%, transparent 98%); mask-image: linear-gradient(#000 74%, transparent 98%); }
  .portrait img { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
  #closed { opacity: 0; }
  .floor { width: min(40vw, 220px); height: 18px; margin-top: -6px; border-radius: 50%; background: radial-gradient(closest-side, var(--floor), transparent); filter: blur(2px); }

  .eyebrow { margin: 34px 0 10px; font: 600 clamp(17px, 2vw, 21px)/1.2 var(--sans); color: var(--muted); letter-spacing: .005em; }
  h1 { margin: 0; font: 700 clamp(44px, 9vw, 96px)/1.02 var(--display); letter-spacing: -.045em; }
  h1 .w { display: inline-block; }
  h1 .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .04em; }
  .wa { margin-top: 30px; display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px 0 20px; border-radius: 999px; background: #25D366; color: #fff; text-decoration: none; font: 600 17px var(--sans); letter-spacing: -.005em;
    box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 10px 28px -8px rgba(37,211,102,.55); transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, filter .25s; }
  .wa:hover { transform: translateY(-2px) scale(1.03); filter: brightness(1.05); box-shadow: 0 2px 4px rgba(0,0,0,.14), 0 16px 34px -8px rgba(37,211,102,.7); }
  .wa:active { transform: scale(.98); }
  .wa:focus-visible { outline: 3px solid color-mix(in srgb, #25D366 55%, transparent); outline-offset: 3px; }
  .wa svg { width: 26px; height: 26px; flex: none; }

  .js .reveal { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .js .reveal { opacity: 1; } }
</style>

  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const stage = document.getElementById("stage"), portrait = document.getElementById("portrait"), closed = document.getElementById("closed");

  // entrada (estilo Apple: sobe, desfoca → nítido)
  if (still) { gsap.set(reveal, { opacity: 1 }); }
  else {
    const words = document.querySelectorAll("h1 .w");
    gsap.set("h1", { opacity: 1 });
    const intro = gsap.timeline({ defaults: { ease: "expo.out" } });
    intro.fromTo(stage, { opacity: 0, y: 30, scale: .94, filter: "blur(18px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 1.6 }, 0.1)
         .fromTo(".floor", { opacity: 0, scaleX: .6 }, { opacity: 1, scaleX: 1, duration: 1.4 }, 0.35)
         .fromTo(".eyebrow", { opacity: 0, y: 14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.1 }, 0.5)
         .fromTo(words, { opacity: 0, y: 28, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.2, stagger: 0.09 }, 0.62)
         .fromTo(".wa", { opacity: 0, y: 14, scale: .94, filter: "blur(8px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 1.1 }, 1.1);

    // respiração leve da cabeça
    gsap.to(portrait, { y: -7, duration: 2.8, ease: "sine.inOut", repeat: -1, yoyo: true, delay: 1.6 });
    gsap.to(portrait, { rotation: 1.4, duration: 4.6, ease: "sine.inOut", repeat: -1, yoyo: true, delay: 1.6 });

    // acompanha o cursor bem de leve
    const rx = gsap.quickTo(stage, "rotationY", { duration: 1.2, ease: "power3.out" });
    const ry = gsap.quickTo(stage, "rotationX", { duration: 1.2, ease: "power3.out" });
    const tx = gsap.quickTo(stage, "x", { duration: 1.2, ease: "power3.out" });
    gsap.set(stage, { transformPerspective: 900 });
    addEventListener("pointermove", (e) => {
      const nx = e.clientX / innerWidth - .5, ny = e.clientY / innerHeight - .5;
      rx(nx * 10); ry(-ny * 8); tx(nx * 10);
    });
  }

  // piscadas naturais (às vezes duas seguidas)
  const blink = () => { gsap.set(closed, { opacity: 1 }); gsap.delayedCall(0.13, () => gsap.set(closed, { opacity: 0 })); };
  const loop = () => gsap.delayedCall(2.4 + Math.random() * 3.2, () => { blink(); if (Math.random() < .22) gsap.delayedCall(.3, blink); loop(); });
  gsap.delayedCall(1.9, () => { blink(); loop(); });
  stage.addEventListener("click", blink);
})();
</script>
</body>
</html>
